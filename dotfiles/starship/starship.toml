# vim: set ts=2 sw=2 tw=2 filetype=toml et :
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Line 1 is an opaque current_line bar. Optional segments are islands on it,
# each wrapped in ( ) so their arrows vanish when the segment is empty.
format = """
($username[](fg:purple bg:current_line))\
([](fg:current_line bg:red)$hostname[](fg:red bg:current_line))\
$directory\
$jobs\
([](fg:current_line bg:pink)$git_branch$git_status[](fg:pink bg:current_line))\
$git_metrics\
([](fg:current_line bg:green)$python$golang$rust[](fg:green bg:current_line))\
([](fg:current_line bg:red)$direnv[](fg:red bg:current_line))\
([](fg:current_line bg:comment)$docker_context[](fg:comment bg:current_line))\
([](fg:current_line bg:orange)$aws[](fg:orange bg:current_line))\
[](fg:current_line)\
$line_break\
$status\
$character"""

right_format = """[](fg:current_line)([](fg:yellow bg:current_line)$cmd_duration[](fg:current_line bg:yellow))$time[](fg:current_line)"""

# Disable the blank line at the start of the prompt
add_newline = false

palette = 'dracula'

command_timeout = 850

# Dracula theme colours: https://github.com/dracula/dracula-theme
[palettes.dracula]
# Palette			Hex
background =		'#282a36'
current_line =		'#44475a'
selection =			'#44475a'
foreground =		'#f8f8f2'
comment =			'#6272a4'
cyan =				'#8be9fd'
green =				'#50fa7b'
orange =			'#ffb86c'
pink =				'#ff79c6'
purple =			'#bd93f9'
red =				'#ff5555'
yellow =			'#f1fa8c'

[username]
show_always = true
style_user = "bg:purple fg:background"
style_root = "bold bg:red fg:background"
format = '[ $user ]($style)'

[hostname]
ssh_symbol = " "
style = "bg:red fg:background"
format = '[ $ssh_symbol$hostname ]($style)'

[directory]
style = "bg:current_line fg:foreground"
read_only_style = "bg:current_line fg:red"
format = '[ $path]($style)[$read_only]($read_only_style)[ ]($style)'
repo_root_style = "bold bg:current_line fg:cyan"
repo_root_format = '[ $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)[ ]($style)'
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[jobs]
style = "bold bg:current_line fg:orange"
format = '[$symbol$number ]($style)'
number_threshold = 2
symbol_threshold = 1

[git_branch]
symbol = ""
style = "bg:pink fg:background"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:pink fg:background"
format = '[($all_status$ahead_behind )]($style)'

[git_metrics]
disabled = false
added_style = "bold bg:current_line fg:green"
deleted_style = "bold bg:current_line fg:red"
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))'

[python]
symbol = " "
style = "bg:green fg:background"
format = '[ ${symbol}(${version} )]($style)'
# Only with an active venv, so the pill itself means "venv active".
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]

[golang]
symbol = " "
style = "bg:green fg:background"
format = '[ $symbol($version )]($style)'

[rust]
symbol = " "
style = "bg:green fg:background"
format = '[ $symbol($version )]($style)'

# Only shown when the .envrc is blocked; the icon is literal so the group can vanish.
[direnv]
disabled = false
style = "bg:red fg:background"
format = '[(  .envrc $allowed )]($style)'
allowed_msg = ""
not_allowed_msg = "not allowed"
denied_msg = "denied"

[docker_context]
symbol = " "
style = "bg:comment fg:foreground"
format = '[ $symbol$context ]($style)'

[aws]
symbol = " "
style = "bg:orange fg:background"
format = '[ $symbol($profile )(\($region\) )(\[$duration\] )]($style)'
expiration_symbol = "expired"

[aws.region_aliases]
eu-west-1 = "eu"
us-east-2 = "us"
ap-southeast-1 = "sg"

[status]
disabled = false
symbol = "✘"
style = "bold red"
format = '[$symbol $status]($style) '
pipestatus = true
pipestatus_separator = "|"
pipestatus_segment_format = '$status'
pipestatus_format = '[$symbol $pipestatus]($style) '

[cmd_duration]
style = "bold bg:yellow fg:background"
format = '[ $duration ]($style)'

[time]
disabled = false
time_format = "%d.%m %T"
style = "bg:current_line fg:foreground"
format = '[ $time ]($style)'
